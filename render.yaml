services:
  - type: web
    name: osint-backend
    env: docker
    repo: https://github.com/shadabahmed786/OSINT_tool
    dockerfilePath: backend/Dockerfile
    plan: free
    buildCommand: ""
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
